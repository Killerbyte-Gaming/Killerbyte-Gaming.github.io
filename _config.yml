title: Killerbyte Gaming
tagline: Maxing as a PvM Noob & Content Hub
# FIXED: The language hook forces Chirpy to map your data translation keys natively
lang: en
description: "Dynamic gaming hub featuring Old School RuneScape (OSRS) guides, gameplay videos, and content feeds."
url: "https://github.io"
baseurl: ""

# Theme Activation Settings
theme: jekyll-theme-chirpy

# Personal Sidebar Customisation Profile
author:
  name: Killerbyte Gaming
  avatar: "/assets/img/Wave 512.png" # Uses your first ep thumbnail as a temporary avatar
  bio: "Content Creator | Tech Enthusiast"
  twitter: "killerbytegame"
  #github: "Killerbyte-Gaming"
  # Chirpy has native icon slots for gaming/social channels built straight in:
  socials:
    - name: twitch
      link: "https://twitch.tv"
    - name: tiktok
      link: "https://tiktok.com"
    - name: instagram
      link: "https://instagram.com"

# Structural Theme Configurations
permalink: /posts/:title/
paginate: 10
timezone: Australia/Brisbane

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-archives

# Exclude uncompiled configuration logs from processing steps
exclude:
  - vendor/
  - Gemfile
  - Gemfile.lock
  - sync-media.yml
  - process_media.py
  - .jekyll-cache/
  - .jekyll-metadata

# Ensure markdown parser allows raw HTML elements to compile smoothly
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
