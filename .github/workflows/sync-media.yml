name: Sync YouTube Media Data

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours
  workflow_dispatch: # Allows manual trigger testing via the Actions tab

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Configure Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Secure Media Extraction Tool
        run: pip install yt-dlp

      - name: Extract and Categorise Content
        run: |
          cat << 'EOF' > process_media.py
          import json
          import os
          import subprocess
          import sys

          domain_chunk = "https://www." + "youtube.com"
          path_chunk = "/channel/"
          id_chunk = "UCpAoQMXFb5Zq7d7egXOjveg"
          
          url = f"{domain_chunk}{path_chunk}{id_chunk}"
          print(f"Connecting securely via extraction layer to: {url}")
          
          try:
              # Fetch the last 15 uploads
              cmd = [
                  "yt-dlp",
                  "--playlist-end", "15",
                  "--dump-json",
                  "--flat-playlist",
                  url
              ]
              
              result = subprocess.run(cmd, capture_output=True, text=True, check=True)
              
              long_form_videos = []
              shorts_videos = []
              
              for line in result.stdout.strip().split("\n"):
                  if not line:
                      continue
                  data = json.loads(line)
                  
                  video_id = data.get("id")
                  title = data.get("title", "")
                  
                  # Look closely at how yt-dlp classifies the original URL track
                  # In modern versions, flat-playlist items still contain metadata anchors 
                  # or can be evaluated by checking their layout properties natively.
                  video_entry = {
                      "id": video_id,
                      "title": title,
                      "link": f"https://youtube.com{video_id}"
                  }
                  
                  # AIR-TIGHT EXTRACTION DETECTOR:
                  # If yt-dlp flagged the item or if we verify it against title/original layouts,
                  # we separate them. Let's run a fallback look for vertical configurations.
                  is_short = False
                  
                  # Check if the title text fields explicitly register your shorts pattern flags
                  if "#shorts" in title.lower() or "shorts" in title.lower():
                      is_short = True
                  # Safe capture: If you want to explicitly separate them, we can also look at video paths
                  elif data.get("ie_key") == "YoutubeShorts" or "/shorts/" in data.get("url", ""):
                      is_short = True
                      
                  if is_short:
                      # Switch link to use vertical shorts layout wrapper format for clean routing
                      video_entry["link"] = f"https://youtube.com{video_id}"
                      shorts_videos.append(video_entry)
                  else:
                      long_form_videos.append(video_entry)
                      
              # Cap both arrays neatly for your website layout spacing limits
              long_form_videos = long_form_videos[:6]
              shorts_videos = shorts_videos[:6]
                  
              os.makedirs("_data", exist_ok=True)
              
              with open("_data/youtube.json", "w", encoding="utf-8") as f:
                  json.dump(long_form_videos, f, ensure_ascii=False, indent=2)
                  
              with open("_data/shorts.json", "w", encoding="utf-8") as f:
                  json.dump(shorts_videos, f, ensure_ascii=False, indent=2)
                  
              print(f"SUCCESS: Generated youtube.json ({len(long_form_videos)}) and shorts.json ({len(shorts_videos)})!")

          except Exception as e:
              print(f"Critical data extraction block failed: {e}")
              sys.exit(1)
          EOF
          python process_media.py

      - name: Commit and Save Data Packages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Automated Update: Synced latest YouTube longform and shorts feeds fresh'
          file_pattern: '_data/*.json'
