name: Fetch Recent YouTube Uploads

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours
  workflow_dispatch: # Allows manual trigger testing via the Actions tab

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Video Extraction Packages
        # THIS IS THE CRITICAL MISSING STEP: Installs the yt-dlp engine onto the Linux runner
        run: pip install yt-dlp

      - name: Fetch and Parse YouTube Feed via Python File
        run: python fetch_youtube.py

      - name: Commit and Push Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Automated Update: Synced latest YouTube longform and shorts feeds'
          file_pattern: '_data/*.json'
