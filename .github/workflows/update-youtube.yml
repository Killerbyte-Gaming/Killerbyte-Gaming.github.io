name: Fetch Recent YouTube Uploads

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Allows manual trigger testing

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch YouTube RSS Feed
        uses: Promptly-Technologies-LLC/rss-fetch-action@v2
        with:
          # Replace UCxxxxxxxxx with your true 24-character YouTube Channel ID
          feed_url: 'https://youtube.com/channel/UCpAoQMXFb5Zq7d7egXOjveg'
          output_path: './_data/youtube.json'

      - name: Commit and Push to Site
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Automated Update: Synced latest YouTube videos'
          file_pattern: '_data/youtube.json'