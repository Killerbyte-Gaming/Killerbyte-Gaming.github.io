# =====================================================================
# GitHub Pages auto-deploy workflow
#
# HOW TO USE (one-time setup on GitHub):
# 1. In your GitHub repo, create a new file named exactly:
#      .github/workflows/deploy.yml
#    (Add file → Create new file, type the path above)
# 2. Paste this entire file's contents into it and commit.
# 3. In your repo: Settings → Pages → Source → select "GitHub Actions".
# 4. Push to your main branch — the site builds and deploys automatically
#    to https://<username>.github.io/<repo-name>/
# =====================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4